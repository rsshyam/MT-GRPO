data:
  tokenizer: null
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False

actor_rollout_ref:
  resume_from: null
  use_checkpoint_manager: False
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: True
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    clip_ratio: 0.2
    clip_ratio_high: null
    agg_loss_mode: "token-mean"
    loss_type: "ppo"
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
    famo:
      enable: False
    log_task_wise_kl: False
    groups: []
    kl_ctrl:
      type: fixed
      kl_coef: 0.001
      target_kl: 0.1
      horizon: 2500
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
    groups: []
    kl_ctrl:
      type: fixed
      kl_coef: 0.001
      target_kl: 0.1
      horizon: 2500
  rollout:
    name: vllm
    temperature: 1.0
    val_temperature: 0.6
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 1
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    enable_chunked_prefill: True
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    n_val: 8
    swap_space: 4

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: True
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
      fsdp_size: -1
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}
  reward: 1.0
  format_reward: 0.1

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  filter_groups:
    max_num_gen_batches: 10
seed: 42
trainer:
  sec:
    sample_with_replacement: False
    enable: False
    strategy: random
    bandit:
      temperature: 1.0
      lr: 0.1
      epsilon: 0.1
      method: boltzmann
      objective: adv
      feature: ['difficulty']
      type: joint
      gamma: 1e-5
      max_rate: False
      fixed_p_each: 0.025
      decay_type: null
      reward_threshold: 0.8
      decay_rate: 0.5
      update_object: 'task_wise_diff'
      change_decay_rate: 0.5
      change_decay_rate_2: 0.5
      SNR_threshold: 0.5
      SNR_eps: 1e-8
      SNR_update_step_threshold: 50
      sharpness: 1.0
      mean_diff_decay: False
      lambda_bias: 0.1
      bias_threshold: 0.01
      lambda_bias_type: 'add'
      conv_penalty: 0.1
      lambda_bias_adaptive: False
      lambda_bias_start: 0.01
      lambda_bias_end: 0.1
      lambda_bias_ramp_frac: 0.9
      total_steps: 720
      opt_threshold: 0.5
      acc_decay_rate: 0.0
      z_decay_rate: 0.0
      one_decay_rate: 0.0
      nznone_decay_rate: 0.0
      opt_decay_rate: 0.0
      solve_none_decay_rate: 0.0
      solve_all_decay_rate: 0.0
      solve_half_decay_rate: 0.0
      batch_acc_decay_rate: 0.0
      preset_probs: null
      temp_probs: null
      groups_to_train: null
      average_delta: False
      delta_threshold: null
      use_opt_ratio: False
      bias_metric: 'reward_gap'
      ensure_famo_ratio: False
      ensure_famo_ratio_from: 0
      try_famo_ratio: False
      try_famo_ratio_from: 0
      resume_from: null
      use_acc: False
      use_reward_diff: False

      knapsack:
        enabled: False
        rollouts_per_task: 8
        type: 'vanilla'
      
      dynamic_rollouts:
        enabled: False
        rollouts_per_task: 8
        max_rollouts_per_task: 144
        filter_threshold: 0.1
        filter_threshold_upper: 0.6
        filtered_ratio_decay_rate: 0.9
        filtered_ratio_update_step_threshold: 50
        filtered_ratio_update_step_freq: 25
      
      efficient_sampling:
        enabled: False
        beta: 1.0
        eps: 1e-2
        mult_max: 5.0
        deterministic: False

  

  famo:
    enable: False
  
  rejection_sample: False # Reject sample prompts that all succeed or all fail (0 signal for GRPO due to normalization).
  rejection_sample_multiplier: 2 # Multiple the training batch size by this factor to account for rejection sampling reduction.
  pure_acc_filter: True # Reject sample prompts that all succeed or all fail (0 signal for GRPO due to normalization) in terms of accuracy.
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: null #~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  val_before_train: False

replay:
    enabled: False
    max_buffer_size: 100
    prob: 0.15
    max_prompts_per_group: 8

